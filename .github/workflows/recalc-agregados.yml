name: Recalcular Agregados (totalInscritos/confirmados)

on:
  schedule:
    # 7h horário de Brasília (BRT = UTC-3) = 10h UTC — reconta a partir da
    # subcoleção real de inscritos e corrige qualquer desvio acumulado
    # (o worker usa delta incremental por pedido, que é barato mas não se
    # autocorrige sozinho se alguma escrita falhar no meio do caminho).
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  recalc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar reconciliação
        run: node scripts/recalc-agregados.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
